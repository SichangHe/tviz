name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo install tauri-cli --version '^2' --locked
      - name: Build universal app
        working-directory: app/src-tauri
        run: cargo tauri build --target universal-apple-darwin
      - name: Zip
        run: |
          cd app/src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent tviz.app "$GITHUB_WORKSPACE/tviz-macos.zip"
      - name: Publish to the nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease --title nightly --notes "Latest build of main."
          gh release upload nightly tviz-macos.zip --clobber
