<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terminal Viz</title>
<link rel="stylesheet" href="vendor/xterm.css">
<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-addon-fit.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/mermaid.min.js"></script>
<style>
:root{--bg:#1e1e1e;--fg:#ddd;--mut:#888;--bd:#333;--pane:#fff;--pfg:#111}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif}
#app{display:flex;height:100%}
#term{flex:1 1 55%;min-width:0;min-height:0;overflow:hidden;padding:4px;box-sizing:border-box}
#bar{width:5px;cursor:col-resize;background:var(--bd)}
#viz{flex:1 1 45%;min-width:0;min-height:0;display:flex;flex-direction:column}
#viz.hidden,#viz.hidden+*{display:none}
#tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;border-bottom:1px solid var(--bd);white-space:nowrap}
#tabs button{background:none;color:var(--mut);border:1px solid var(--bd);border-radius:4px;padding:2px 8px;cursor:pointer}
#tabs button.on{color:var(--fg);border-color:var(--fg)}
#view{flex:1;overflow:auto;background:var(--pane);color:var(--pfg)}
#view iframe{border:0;width:100%;height:100%}
#view img{max-width:100%;display:block;margin:auto}
#view .md{padding:12px 16px;max-width:900px}
#hint{color:var(--mut);padding:16px}
.vizonly #term,.vizonly #bar,.vizonly #hint kbd{display:none}
@media (max-width:700px){#app{flex-direction:column}#bar{display:none}#term,#viz{flex:1 1 50%}}
</style></head>
<body><div id="app"><div id="term"></div><div id="bar"></div>
<div id="viz"><div id="tabs"></div><div id="view"><div id="hint">Run <code>viz FILE</code> on the server (needs <code>ssh -L 8790:127.0.0.1:8790</code>) to show html/svg/png/md/mmd here. Alt+V toggles this pane.</div></div></div></div>
<script>
const VIZ = "localhost:8790", base = "ws://" + VIZ;
if (!document.body.classList.contains("vizonly")) {
const term = new Terminal({fontSize: 14, fontFamily: "Menlo, monospace", cursorBlink: true, scrollback: 10000, macOptionIsMeta: true, allowProposedApi: true}), fit = new FitAddon.FitAddon();
term.loadAddon(fit); term.open(document.getElementById("term"));
const enc = new TextEncoder(), T = window.__TAURI__;
const out = new T.core.Channel(); out.onmessage = d => term.write(new Uint8Array(d));
fit.fit(); T.core.invoke("pty_spawn", {cols: term.cols, rows: term.rows, out});
function resize() { fit.fit(); T.core.invoke("pty_resize", {cols: term.cols, rows: term.rows}); }
const send = b => T.core.invoke("pty_write", b);
term.onData(d => send(enc.encode(d)));
term.onBinary(d => send(Uint8Array.from(d, c => c.charCodeAt(0))));
const toggle = e => {
  if (e.type === "keydown" && e.altKey && e.code === "KeyV") { e.preventDefault(); document.getElementById("viz").classList.toggle("hidden"); document.getElementById("term").style.flex = ""; setTimeout(() => { resize(); term.focus(); }); return false; }
  return true;
};
term.attachCustomKeyEventHandler(toggle);
document.addEventListener("keydown", e => { if (!e.target.closest("#term")) toggle(e); });
new ResizeObserver(resize).observe(document.getElementById("term"));
term.focus();

const bar = document.getElementById("bar"), termEl = document.getElementById("term");
bar.onpointerdown = e => { bar.setPointerCapture(e.pointerId); bar.onpointermove = m => termEl.style.flex = `0 0 ${m.clientX}px`; };
bar.onpointerup = () => bar.onpointermove = null;
}

mermaid.initialize({startOnLoad: false});
let shown = null, list = [];
async function show(name, mtime) {
  shown = name; const view = document.getElementById("view"), url = "http://" + VIZ + "/items/" + encodeURIComponent(name) + "?t=" + mtime;
  const ext = name.split(".").pop().toLowerCase();
  if (["png", "jpg", "jpeg", "gif", "webp", "svg"].includes(ext)) view.innerHTML = `<img src="${url}">`;
  else if (["html", "htm"].includes(ext)) view.innerHTML = `<iframe sandbox="allow-scripts" src="${url}"></iframe>`;
  else {
    const text = await (await fetch(url)).text(), div = document.createElement("div"); div.className = "md";
    if (ext === "md") { const f = document.createElement("iframe"); f.sandbox = ""; f.srcdoc = `<meta charset="utf-8"><style>body{font:14px system-ui;padding:8px 16px;max-width:900px}</style>` + marked.parse(text); view.replaceChildren(f); renderTabs(); return; }
    else if (ext === "mmd") div.innerHTML = (await mermaid.render("m" + Date.now(), text)).svg;
    else { const pre = document.createElement("pre"); pre.textContent = text; div.append(pre); }
    view.replaceChildren(div);
  }
  renderTabs();
}
function renderTabs() {
  document.getElementById("tabs").replaceChildren(...list.map(it => {
    const b = document.createElement("button"); b.textContent = it.name; b.className = it.name === shown ? "on" : "";
    b.onclick = () => show(it.name, it.mtime); return b;
  }));
}
let first = true;
function events() {
  const ws = new WebSocket(base + "/events");
  ws.onmessage = e => {
    const prev = list; list = JSON.parse(e.data);
    const newest = list[0], changed = newest && !prev.some(p => p.name === newest.name && p.mtime === newest.mtime);
    if (newest && (changed && !first || !shown)) { document.getElementById("viz").classList.remove("hidden"); show(newest.name, newest.mtime); }
    else renderTabs();
    first = false;
  };
  ws.onclose = () => setTimeout(events, 1000);
}
events();
</script></body></html>
